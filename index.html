<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Painel de OS — Luthieria Baratieri (uso local)</title>
  <meta name="description"
    content="Painel de ordens de serviço para luthieria: fluxo da oficina, valores e recebimentos. Dados no seu aparelho. Complemento ao ecossistema Luthieria Baratieri.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c0a09">
</head>

<body class="layout-brinde">

  <header class="app-header site-header" role="banner">
    <div class="site-header-inner">
      <a class="app-header-brand brand-link" href="https://luthieriabaratieri.com.br/" target="_blank"
        rel="noopener noreferrer" title="Abrir site oficial — Luthieria Baratieri">
        <img src="./assets/logotipo.png" alt="Luthieria Baratieri">
        <div class="app-header-text">
          <span class="app-title">Luthieria Baratieri</span>
          <span class="app-sub">Painel de ordens de serviço</span>
          
        </div>
      </a>
      <button type="button" id="fab" class="fab" title="Nova ordem de serviço">＋ Nova OS</button>
    </div>
  </header>
  <!-- 
  <section class="page-hero" aria-label="Sobre este painel">
    <h1 class="page-hero-title">Controle da oficina em um só lugar</h1>
    
  </section> -->

  <div id="form-container" class="form-container" aria-hidden="true" role="dialog">
    <div class="form-header">
      <button type="button" class="btn-icon" onclick="fecharForm()" aria-label="Voltar">←</button>
      <h2 id="form-title">Nova ordem de serviço</h2>
    </div>

    <form id="form" class="form-app">
      <label class="field-label">Cliente</label>
      <input id="cliente" placeholder="Nome completo" required autocomplete="name">

      <label class="field-label">Contato &amp; endereço</label>
      <input id="telefone" placeholder="WhatsApp / telefone" inputmode="tel" autocomplete="tel">
      <input id="endereco" placeholder="Endereço (opcional)" autocomplete="street-address">

      <label class="field-label">Instrumento</label>
      <input id="instrumento" placeholder="Ex.: Strato Fender MIM 2018">

      <label class="field-label">Fotos da OS <span class="hint">(opcional)</span></label>
      <div class="photo-fields">
        <div class="photo-field-card">
          <div class="photo-field-head">
            <strong>Antes</strong>
            <button type="button" class="btn-photo-remove" id="fotoAntesRemover" hidden>Remover</button>
          </div>
          <input type="file" id="fotoAntesInput" class="sr-only" accept="image/*" capture="environment">
          <button type="button" class="btn-photo-pick" id="fotoAntesBtn">Tirar / escolher foto</button>
          <img id="fotoAntesPreview" class="photo-preview" alt="Pré-visualização da foto de antes" hidden>
        </div>
        <div class="photo-field-card">
          <div class="photo-field-head">
            <strong>Depois</strong>
            <button type="button" class="btn-photo-remove" id="fotoDepoisRemover" hidden>Remover</button>
          </div>
          <input type="file" id="fotoDepoisInput" class="sr-only" accept="image/*" capture="environment">
          <button type="button" class="btn-photo-pick" id="fotoDepoisBtn">Tirar / escolher foto</button>
          <img id="fotoDepoisPreview" class="photo-preview" alt="Pré-visualização da foto de depois" hidden>
        </div>
      </div>

      <label class="field-label">Problema / pedido do cliente</label>
      <textarea id="problema" placeholder="O que o cliente relatou ou pediu"></textarea>

      <label class="field-label">Notas internas <span class="hint">(só oficina)</span></label>
      <textarea id="notasInternas" class="textarea-notas"
        placeholder="Trastes 7–9 baixos, combinado retirada sábado…"></textarea>

      <label class="field-label">Serviço extra</label>
      <input id="extraNome" placeholder="Descrição (opcional)">
      <input id="extraValor" type="number" placeholder="Valor extra (R$)" min="0" step="0.01">

      <label class="field-label">Desconto (R$)</label>
      <input id="desconto" type="number" placeholder="0" min="0" step="0.01">

      <label class="field-label">Serviços da tabela</label>
      <div id="checklist-servicos" class="checklist-servicos"></div>

      <label class="field-label">Orçamento total (R$)</label>
      <input id="orcamento" placeholder="Calculado pela checklist" type="number" min="0" step="0.01">

      <label class="field-label">Situação legada</label>
      <select id="pagamento">
        <option value="pendente">Pendente</option>
        <option value="pago">Pago</option>
      </select>

      <div class="form-actions">
        <button type="button" class="cancelar" onclick="fecharForm()">Fechar</button>
        <button type="submit" class="salvar">Salvar OS</button>
      </div>
    </form>
  </div>

  <div id="modal-root" class="modal-root" aria-hidden="true">
    <div class="modal-backdrop" data-modal-dismiss></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h3 id="modal-title" class="modal-title"></h3>
        <button type="button" class="modal-close" id="modal-close" aria-label="Fechar">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="import-file" class="sr-only" accept="application/json,.json" aria-hidden="true">

  <main class="main-area main-grow">
    <p id="storage-hint" class="local-hint"></p>
    <div class="toolbar">
      <div class="toolbar-search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input type="search" id="busca" placeholder="Buscar cliente, instrumento, OS…" autocomplete="off">
      </div>
      <div class="toolbar-row">
        <label class="sr-only" for="filtroStatus">Coluna do fluxo</label>
        <select id="filtroStatus" class="toolbar-select">
          <option value="entrada">Entrada</option>
          <option value="diagnostico">Diagnóstico</option>
          <option value="orcamento">Orçamento</option>
          <option value="em_andamento">Em andamento</option>
          <option value="pronto">Pronto</option>
          <option value="entregue">Entregue</option>
        </select>
        <button type="button" class="btn-toolbar" id="btn-historico" onclick="verArquivados()">Histórico</button>
        <button type="button" class="btn-toolbar btn-toolbar-secondary" id="btn-catalogo">Preços</button>
        <button type="button" class="btn-toolbar btn-toolbar-secondary" id="btn-backup">Backup JSON</button>
        <button type="button" class="btn-toolbar btn-toolbar-secondary" id="btn-import">Importar JSON</button>
      </div>
    </div>

    <h2 class="section-title">Quadro de serviços</h2>
    <div id="kanban" class="kanban"></div>
  </main>

  <footer class="site-footer" role="contentinfo">

    <div class="site-footer-col-wide">
      <p class="site-footer-copy">Gestão de OS</p>
      <span>|</span>
      <span class="app-tagline">Ecossistema Método Baratieri</span>
    </div>
   

      <ul class="site-footer-links">
        <li><a href="https://luthieriabaratieri.com.br/" target="_blank" rel="noopener noreferrer">Site oficial</a></li>
        <li><a href="https://luthieriabaratieri.com.br/blog/" target="_blank" rel="noopener noreferrer">Blog</a></li>
        <li><a href="https://metodo.luthieriabaratieri.com.br/metodo-baratieri-app-luthieria" class="site-footer-cta"
            target="_blank" rel="noopener noreferrer">Método Baratieri</a></li>
        <li><a href="https://metodo.luthieriabaratieri.com.br/parceiros-afiliados-metodo-baratieri" target="_blank"
            rel="noopener noreferrer">Afiliados</a></li>
      </ul>

    
    <p class="site-footer-legal">&copy; 2026 Luthieria Baratieri — Todos os direitos reservados</p>
  </footer>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("/sw.js").catch(() => { });
    }
  </script>
</body>

</html>
